name: Build and package
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build -c Release
      - name: Portable regression (original PCL EXE is not included)
        run: dotnet run --project tests/PCLPatcher.Tests.csproj -c Release
      - name: Build four packages
        shell: pwsh
        run: ./scripts/release.ps1
      - name: Smoke test packaged Windows binaries
        shell: pwsh
        run: |
          foreach ($archive in Get-ChildItem artifacts/*-win-x64-*.zip) {
            $folder = Join-Path $env:RUNNER_TEMP $archive.BaseName
            Expand-Archive -LiteralPath $archive.FullName -DestinationPath $folder
            & (Join-Path $folder 'PCLPatcher.exe') --version
            if ($LASTEXITCODE -ne 0) { throw 'Packaged executable failed.' }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: PCLPatcher-release-assets
          path: artifacts/*
      # A tag creates a draft; publication remains a separate human action.
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME artifacts/* --draft --verify-tag --title "PCLPatcher $env:GITHUB_REF_NAME" --notes-file RELEASE-NOTES.md
    permissions:
      contents: write
